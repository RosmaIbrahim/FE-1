<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiBas - Login</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-logo">
                <img src="logo tulisan.png" alt="Logo Si-Bas">
            </div>
            <div class="auth-header">
                <h1 id="auth-title">Selamat Datang!</h1>
                <p id="auth-subtitle">Masuk ke akun Si-Bas Anda.</p>
            </div>
            <div class="auth-tabs">
                <button type="button" id="login-tab" class="auth-tab active" onclick="showLogin()">Masuk</button>
                <button type="button" id="register-tab" class="auth-tab" onclick="showRegister()">Daftar</button>
            </div>

            <!-- LOGIN -->
            <form id="login-form">
                <div class="form-group">
                    <label>Masuk sebagai</label>
                    <div class="role-tabs">
                        <button type="button" id="role-user" class="role-btn user active" onclick="selectRole('user')">User</button>
                        <button type="button" id="role-admin" class="role-btn admin" onclick="selectRole('admin')">Admin</button>
                        <button type="button" id="role-superadmin" class="role-btn superadmin" onclick="selectRole('superadmin')">Super Admin</button>
                    </div>
                </div>
                <div class="form-group">
                    <label id="identity-label" for="identity">NIK</label>
                    <input type="text" id="identity" placeholder="Masukkan NIK" required>
                    <small id="login-identity-error" class="input-error hidden"></small>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Masukkan password" required>
                </div>
                <button type="submit" class="submit-btn user-btn">Masuk</button>
                <p class="switch-auth">
                    Belum punya akun?
                    <button type="button" onclick="showRegister()">Daftar</button>
                </p>
            </form>

            <!-- REGISTER-->
            <form id="register-form" class="hidden">
                <div class="form-group">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" placeholder="Masukkan nama lengkap" required>
                </div>
                <div class="form-group">
                    <label for="nik">NIK</label>
                    <input type="text" id="nik" placeholder="Masukkan 16 digit NIK" inputmode="numeric" maxlength="16" required>
                    <small id="nik-error" class="input-error hidden"></small>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" placeholder="Buat password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Konfirmasi Password</label>
                    <input type="password" id="confirm-password" placeholder="Ulangi password" required>
                    <small id="password-error" class="input-error hidden"></small>
                </div>
                <button type="submit" class="submit-btn user-btn">Daftar</button>
                <p class="switch-auth">
                    Sudah punya akun?
                    <button type="button" onclick="showLogin()">Masuk</button>
                </p>
            </form>
        </section>
    </main>

<script>
const loginForm = document.getElementById("login-form");
const registerForm = document.getElementById("register-form");
const loginTab = document.getElementById("login-tab");
const registerTab = document.getElementById("register-tab");
const authTitle = document.getElementById("auth-title");
const authSubtitle = document.getElementById("auth-subtitle");
const identityLabel = document.getElementById("identity-label");
const identityInput = document.getElementById("identity");
const roleButtons = {
    user: document.getElementById("role-user"),
    admin: document.getElementById("role-admin"),
    superadmin: document.getElementById("role-superadmin")
};
const nikInput = document.getElementById("nik");
const nikError = document.getElementById("nik-error");
const passwordError = document.getElementById("password-error");
const loginIdentityError = document.getElementById("login-identity-error");

function showLogin() {
    loginForm.classList.remove("hidden");
    registerForm.classList.add("hidden");
    loginTab.classList.add("active");
    registerTab.classList.remove("active");
    authTitle.textContent = "Selamat Datang!";
    authSubtitle.textContent = "Masuk ke akun Si-Bas Anda.";
    clearErrors();
}

function showRegister() {
    loginForm.classList.add("hidden");
    registerForm.classList.remove("hidden");
    loginTab.classList.remove("active");
    registerTab.classList.add("active");
    authTitle.textContent = "Buat Akun";
    authSubtitle.textContent = "Daftar sebagai pengguna Si-Bas.";
    clearErrors();
}

function selectRole(role) {
    Object.values(roleButtons).forEach(button => button.classList.remove("active"));
    roleButtons[role].classList.add("active");
    loginIdentityError.classList.add("hidden");
    identityInput.value = "";

    if (role === "user") {
        identityLabel.textContent = "NIK";
        identityInput.placeholder = "Masukkan NIK";
        identityInput.inputMode = "numeric";
        identityInput.maxLength = 16;
    } else {
        identityLabel.textContent = "Username";
        identityInput.placeholder = "Masukkan username";
        identityInput.inputMode = "text";
        identityInput.removeAttribute("maxlength");
    }
}

function onlyNumber(input) {
    input.value = input.value.replace(/\D/g, "").slice(0, 16);
}

identityInput.addEventListener("input", function() {
    if (roleButtons.user.classList.contains("active")) {
        onlyNumber(this);
        loginIdentityError.classList.add("hidden");
    }
});

nikInput.addEventListener("input", function() {
    onlyNumber(this);
    nikError.classList.add("hidden");
});

document.getElementById("confirm-password").addEventListener("input", function() {
    passwordError.classList.add("hidden");
});

registerForm.addEventListener("submit", function(event) {
    event.preventDefault();
    const nik = nikInput.value.trim();
    const password = document.getElementById("register-password").value;
    const confirmPassword = document.getElementById("confirm-password").value;

    if (!/^\d{16}$/.test(nik)) {
        nikError.textContent = "NIK harus terdiri dari 16 digit.";
        nikError.classList.remove("hidden");
        nikInput.focus();
        return;
    }

    if (password !== confirmPassword) {
        passwordError.textContent = "Konfirmasi password tidak sesuai.";
        passwordError.classList.remove("hidden");
        document.getElementById("confirm-password").focus();
        return;
    }
});

loginForm.addEventListener("submit", function(event) {
    event.preventDefault();
    const identity = identityInput.value.trim();

    if (roleButtons.user.classList.contains("active") && !/^\d{16}$/.test(identity)) {
        loginIdentityError.textContent = "NIK harus terdiri dari 16 digit.";
        loginIdentityError.classList.remove("hidden");
        identityInput.focus();
        return;
    }
});

function clearErrors() {
    nikError.textContent = "";
    passwordError.textContent = "";
    loginIdentityError.textContent = "";
    nikError.classList.add("hidden");
    passwordError.classList.add("hidden");
    loginIdentityError.classList.add("hidden");
}

showLogin();
selectRole("user");
</script>
</body>
</html>
